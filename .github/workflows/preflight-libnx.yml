name: preflight (libnx fetch)
on: [push, workflow_dispatch]

jobs:
  fetch-as-non-root:
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64:latest
    steps:
      - name: the snippet the job runs, as a user who cannot write /opt
        run: |
          useradd -m unprivileged
          su unprivileged -c '
            set -e
            CMAKE_VER=3.31.6
            ! tar -tf /dev/null -C /opt 2>/dev/null || true
            mkdir /opt/should-not-work 2>&1 || echo "as expected: /opt is not writable"
            curl -sSL "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VER}/cmake-${CMAKE_VER}-linux-x86_64.tar.gz" | tar -xz -C /tmp
            export PATH="/tmp/cmake-${CMAKE_VER}-linux-x86_64/bin:$PATH"
            command -v cmake
            cmake --version'
